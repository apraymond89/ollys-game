function generateGeoQuestion(types,cDecks,sDecks){
  var worldT=types.filter(t=>t.indexOf("state")!==0&&t!=="countrySilhouette"&&t!=="stateShape");
  var otherT=types.filter(t=>t.indexOf("state")===0||t==="countrySilhouette"||t==="stateShape");
  var type;
  if(otherT.length&&Math.random()<(otherT.length/(otherT.length+worldT.length)))type=otherT[Math.floor(Math.random()*otherT.length)];
  else type=worldT[Math.floor(Math.random()*Math.max(worldT.length,1))];
  function nextC(k){if(!cDecks[k]||cDecks[k].idx>=cDecks[k].deck.length){cDecks[k]={deck:shuffle(ALL_COUNTRIES.slice()),idx:0};}return cDecks[k].deck[cDecks[k].idx++];}
  function nextS(k){if(!sDecks[k]||sDecks[k].idx>=sDecks[k].deck.length){sDecks[k]={deck:shuffle(STATE_FLAGS.slice()),idx:0};}return sDecks[k].deck[sDecks[k].idx++];}
  function nextMapC(k){var mc=COUNTRIES.filter(x=>x.id);if(!cDecks[k]||cDecks[k].idx>=cDecks[k].deck.length){cDecks[k]={deck:shuffle(mc),idx:0};}return cDecks[k].deck[cDecks[k].idx++];}
  var c,s,opts;
  if(type==="worldFlag"){c=nextC("wf");opts=shuffle([c,...pick(ALL_COUNTRIES,3,[c])]);return{type,question:"Which flag belongs to "+c.name+"?",options:opts.map(x=>({label:x.flag,value:x.name})),answer:c.name,display:"bigflag"};}
  if(type==="countryShape"){c=nextMapC("cs");var wo=shuffle(COUNTRIES.filter(x=>x.id&&x.id!==c.id)).slice(0,3);opts=shuffle([c,...wo]);return{type,question:"Which country is highlighted?",countryHighlight:c,options:opts.map(x=>({label:x.name,value:x.name})),answer:c.name,display:"text"};}
  if(type==="countrySilhouette"){c=nextMapC("csi");var wo2=shuffle(COUNTRIES.filter(x=>x.id&&x.id!==c.id)).slice(0,3);opts=shuffle([c,...wo2]);return{type,question:"Name this country from its shape!",countrySilhouette:c,options:opts.map(x=>({label:x.name,value:x.name})),answer:c.name,display:"text"};}
  if(type==="stateShape"){s=nextS("ss");opts=shuffle([s,...pick(STATE_FLAGS,3,[s])]);return{type,question:"Name this US state from its shape!",stateShapeName:s.name,options:opts.map(x=>({label:x.name,value:x.name})),answer:s.name,display:"text"};}
  if(type==="stateCapital"){s=nextS("sc");opts=shuffle([s,...pick(STATE_FLAGS,3,[s])]);return{type,question:"What is the capital of "+s.name+"?",options:opts.map(x=>({label:x.capital,value:x.capital})),answer:s.capital,display:"text"};}
  c=nextC("wc");opts=shuffle([c,...pick(ALL_COUNTRIES,3,[c])]);return{type:"worldCapital",question:"What is the capital of "+c.name+"?",bigEmoji:c.flag,options:opts.map(x=>({label:x.capital,value:x.capital})),answer:c.capital,display:"text"};
}

async function loadConstellationData(){
  if(_constellationsReady)return _constellationsList;
  try{
    var [lR,nR,sR]=await Promise.all([fetch(CELESTIAL_BASE+"/constellations.lines.json").then(r=>r.json()),fetch(CELESTIAL_BASE+"/constellations.json").then(r=>r.json()),fetch(CELESTIAL_BASE+"/stars.6.json").then(r=>r.json())]);
    _constLinesData=lR;_constNamesData=nR;_starsData=sR;
    try{var snR=await fetch(CELESTIAL_BASE+"/starnames.json");if(snR.ok)_starNamesData=await snR.json();}catch(e){}
    var sm={};_starsData.features.forEach(f=>{var p=f.properties||{};sm[f.id]={lon:f.geometry.coordinates[0],lat:f.geometry.coordinates[1],name:p.name||""};});
    if(_starNamesData)Object.keys(_starNamesData).forEach(h=>{var nm=_starNamesData[h].name||_starNamesData[h].desig||"";if(sm[h])sm[h].name=nm;});
    var nm={};_constNamesData.features.forEach(f=>{nm[f.id]={name:f.properties.name,en:f.properties.en||f.properties.name};});
    _constellationsList=_constLinesData.features.map(f=>{
      var id=f.id,n=nm[id]||{name:id,en:id};
      if(CONST_OVERRIDES[id]){var ov=CONST_OVERRIDES[id];var ovS=ov.stars.map((s,i)=>({lon:s.x,lat:s.y,idx:i}));var ovN=ov.stars.map((s,i)=>({idx:i,name:s.n})).filter(s=>s.name.length>2);return{id,name:ov.name||n.name,en:ov.en||n.en,stars:ovS,lines:ov.lines,namedStars:ovN,isOverride:true};}
      var coords=f.geometry.coordinates,spm={},lines=[];
      coords.forEach(seg=>{var idxs=seg.map(pt=>{var k=pt[0].toFixed(4)+","+pt[1].toFixed(4);if(!spm[k])spm[k]={lon:pt[0],lat:pt[1],idx:Object.keys(spm).length};return spm[k].idx;});for(var i=0;i<idxs.length-1;i++)lines.push([idxs[i],idxs[i+1]]);});
      var stars=Object.values(spm).sort((a,b)=>a.idx-b.idx);
      var named=[];stars.forEach((s,si)=>{var bd=1.5,bn=null;Object.values(sm).forEach(st=>{if(!st.name)return;var d=Math.sqrt(Math.pow(st.lon-s.lon,2)+Math.pow(st.lat-s.lat,2));if(d<bd){bd=d;bn=st.name;}});if(bn)named.push({idx:si,name:bn});});
      return{id,name:n.name,en:n.en,stars,lines,namedStars:named};
    }).filter(c=>c.stars.length>=2);
    // Deduplicate by id — d3-celestial has two "Ser" features (Caput + Cauda); keep first only
    var _seen=new Set();_constellationsList=_constellationsList.filter(c=>{if(_seen.has(c.id))return false;_seen.add(c.id);return true;});
    _constellationsReady=true;return _constellationsList;
  }catch(e){console.error("Constellation load error:",e);return[];}
}

        <div className="gs-modes" style={{display:"flex",flexDirection:"column",gap:6,marginBottom:20}}>{modes.map(m=>{var act=(gameMode===m.mode)&&((m.mode==="geo"&&diffKey===m.sub)||(m.mode==="space"&&spaceSubMode===m.sub));var isSp=m.mode==="space";return(<button className="gs-mode-btn" key={m.label} onClick={()=>{setGameMode(m.mode);if(m.mode==="geo")setDiffKey(m.sub);else setSpaceSubMode(m.sub);}} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",borderRadius:10,border:act?`2px solid ${isSp?"#6a1b9a":"#2980b9"}`:"2px solid #e0e0e0",background:act?(isSp?"linear-gradient(135deg,#6a1b9a,#4a148c)":"linear-gradient(135deg,#2980b9,#1a5f8a)"):"#f8f8f8",color:act?"white":"#333",cursor:"pointer",textAlign:"left"}}><span style={{fontSize:20,minWidth:26,textAlign:"center"}}>{m.emoji}</span><div><div style={{fontSize:13,fontWeight:"bold",lineHeight:1.2}}>{m.label}</div><div className="gs-mode-desc" style={{fontSize:10,opacity:act?.85:.55,marginTop:1}}>{m.desc}</div></div></button>);})}</div>
        {constLoading&&gameMode==="space"&&<div style={{fontSize:11,color:"#999",marginBottom:8}}>Loading constellation data...</div>}
        <button className="gs-start-btn" onClick={()=>startGame(gameMode,spaceSubMode)} disabled={gameMode==="space"&&constLoading} style={{padding:"12px 44px",fontSize:18,borderRadius:14,border:"none",background:gameMode==="space"&&constLoading?"#ccc":gameMode==="space"?"linear-gradient(135deg,#6a1b9a,#9c27b0)":"linear-gradient(135deg,#FF6B6B,#FF8E53)",color:"white",cursor:gameMode==="space"&&constLoading?"not-allowed":"pointer",fontWeight:"bold"}}>{gameMode==="space"&&constLoading?"Loading stars... ⏳":gameMode==="space"?"Blast Off! 🚀":"Let's Go! 🌍"}</button>
      </div></div>);
  }
  if(screen==="win"){return(<div style={{minHeight:"100vh",background:isSpace?"linear-gradient(135deg,#0a0020,#4a148c,#1a0040)":"linear-gradient(135deg,#f6d365,#fda085)",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"sans-serif"}}><CelebrationBlast active/>{isSpace&&<SpaceBg/>}<div style={{background:"white",borderRadius:24,padding:40,textAlign:"center",maxWidth:400,boxShadow:"0 20px 60px rgba(0,0,0,0.3)",zIndex:10,position:"relative"}}><div style={{fontSize:80}}>🏆</div><h1 style={{fontSize:28,color:"#333"}}>{isSpace?"Mission Complete!":"You Win!"} {character.emoji}</h1><p style={{fontSize:16,color:"#666"}}>Score: <strong style={{fontSize:22,color:"#27ae60"}}>{score}</strong> / <strong>{total}</strong></p><button onClick={()=>setScreen("start")} style={{marginTop:20,padding:"14px 40px",fontSize:18,borderRadius:16,border:"none",background:isSpace?"linear-gradient(135deg,#6a1b9a,#9c27b0)":"linear-gradient(135deg,#FF6B6B,#FF8E53)",color:"white",cursor:"pointer",fontWeight:"bold"}}>Play Again! 🚀</button></div></div>);}

  var cont=isSpace?null:getContinent(position);
  return(<div className={`gs-root${moving?' gs-mode-board':' gs-mode-question'}`} style={{minHeight:"100vh",background:"linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)",fontFamily:"sans-serif",padding:12,position:"relative"}}>
    {isSpace?<SpaceBg/>:<GeoBg name={cont.bg}/>}
    {showSettings&&<SettingsMenu onClose={()=>setShowSettings(false)} onHome={()=>{setShowSettings(false);setScreen("start");}} onRestart={()=>{setShowSettings(false);startGame(gameMode,spaceSubMode);}}/>}
    <button onClick={()=>setShowSettings(true)} style={{position:"fixed",top:12,left:12,zIndex:50,fontSize:22,background:"rgba(255,255,255,0.15)",border:"none",borderRadius:10,padding:"6px 10px",cursor:"pointer"}}>⚙️</button>
    <button onClick={()=>setMuted(Audio.toggleMute())} style={{position:"fixed",top:12,left:64,zIndex:50,fontSize:22,background:"rgba(255,255,255,0.15)",border:"none",borderRadius:10,padding:"6px 10px",cursor:"pointer"}}>{muted?"🔇":"🔊"}</button>
    <div className="gs-inner" style={{maxWidth:520,margin:"0 auto",position:"relative",zIndex:1}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:10,gap:6,paddingLeft:120}}>{[`${character.emoji} ${position}/100`,`Score: ${score}/${total}`].map(t=><div key={t} style={{background:"rgba(255,255,255,0.15)",borderRadius:10,padding:"5px 10px",color:"white",fontWeight:"bold",fontSize:13,flex:1,textAlign:"center"}}>{t}</div>)}</div>
      <BoardGrid position={position} targetPosition={targetPos} character={character} onDone={handleMoveDone} isSpace={isSpace}/>
      <div ref={questionWrapRef} className="gs-question-wrap" style={{marginTop:10}}>
        {q&&!moving&&(<div className="gs-question-card" style={{background:"rgba(255,255,255,0.97)",borderRadius:20,padding:16,boxShadow:"0 8px 32px rgba(0,0,0,0.4)"}}>
          {showResult&&isCorrect&&(<div style={{textAlign:"center",marginBottom:12}}><p style={{color:"#27ae60",fontWeight:"bold",fontSize:18,marginBottom:8}}>🎉 Correct!</p><SpinnerWheel onResult={handleSpin}/>{q.funFact&&<div style={{marginTop:10,padding:"8px 12px",background:"#f0f8ff",borderRadius:10,border:"2px solid #b3d9ff",fontSize:13,color:"#1a5f8a",textAlign:"center"}}>💡 {q.funFact}</div>}<div style={{marginTop:10,display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>{q.options.map(o=>{var bg2=o.value===q.answer?"#C8F7C5":"#f5f5f5",brd=o.value===q.answer?"2px solid #27ae60":"2px solid #e0e0e0";return <div key={o.value} style={{padding:q.display==="bigflag"?"10px 4px":"8px 6px",fontSize:q.display==="bigflag"?32:13,borderRadius:10,border:brd,background:bg2,color:o.value===q.answer?"#1a7a40":"#aaa",fontWeight:o.value===q.answer?"bold":"normal",textAlign:"center"}}>{o.label}</div>;})}</div></div>)}
          {!showResult&&(<div><QMedia q={q}/><p className="gs-q-text" style={{fontSize:15,fontWeight:"bold",color:"#333",textAlign:"center",marginBottom:12,lineHeight:1.4}}>{q.question}</p><div className="gs-answer-grid" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>{q.options.map(o=><button key={o.value} onClick={()=>handleAnswer(o.value)} style={{padding:q.display==="bigflag"?"16px 8px":"12px 8px",fontSize:q.display==="bigflag"?40:13,borderRadius:12,border:"2px solid #e0e0e0",background:"white",color:"#333",cursor:"pointer",fontWeight:"bold",lineHeight:1.3}}>{o.label}</button>)}</div></div>)}
          {showResult&&!isCorrect&&(<div><QMedia q={q}/><p className="gs-q-text" style={{fontSize:15,fontWeight:"bold",color:"#333",textAlign:"center",marginBottom:10}}>{q.question}</p><div className="gs-answer-grid" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>{q.options.map(o=>{var bg2="white",brd="2px solid #e0e0e0";if(o.value===q.answer){bg2="#C8F7C5";brd="2px solid #27ae60";}else if(o.value===selected){bg2="#FADBD8";brd="2px solid #e74c3c";}return <button key={o.value} disabled style={{padding:q.display==="bigflag"?"16px 8px":"12px 8px",fontSize:q.display==="bigflag"?40:13,borderRadius:12,border:brd,background:bg2,color:"#333",fontWeight:"bold",lineHeight:1.3}}>{o.label}</button>;})}</div>{q.funFact&&<div style={{marginBottom:10,padding:"8px 12px",background:"#fff8e1",borderRadius:10,border:"2px solid #ffe082",fontSize:13,color:"#7a5a00",textAlign:"center"}}>💡 {q.funFact}</div>}<p style={{color:"#e74c3c",fontWeight:"bold",fontSize:15,textAlign:"center",marginBottom:4}}>Not quite! Keep going!</p><p style={{color:"#27ae60",fontSize:13,marginBottom:10,textAlign:"center"}}>Answer: <strong>{q.answer}</strong></p><button onClick={advanceQuestion} style={{padding:"11px 28px",fontSize:15,borderRadius:12,border:"none",background:"#FF6B6B",color:"white",cursor:"pointer",fontWeight:"bold",width:"100%"}}>Next Question</button></div>)}
        </div>)}
        {moving&&<div style={{textAlign:"center",color:"white",fontSize:20,fontWeight:"bold",marginTop:20}}>{character.emoji} {isSpace?"Zooming through space... 🚀":"Moving... 🌍"}</div>}
      </div>
    </div>
  </div>);
}

// ── Mount the app ──
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<OllysGame/>);
</script>
</body>
</html>
